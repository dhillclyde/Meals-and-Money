name: EAS Update

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: eas update --branch preview --message "manual run" --non-interactive
